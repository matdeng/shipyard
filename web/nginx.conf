# Served by nginx-unprivileged (runs as non-root, listens on 8080).
# "app" resolves to the API container in Docker Compose and to the
# "app" Service in Kubernetes, so the same file works in both places.
# No keepalive on purpose: each request opens a new connection, so the
# Kubernetes Service spreads requests across every app replica (that's
# what the "yard" on the page visualises).
upstream shipyard_api {
    server app:8000;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # static frontend
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API: reverse proxy to the Flask app
    location /api/ {
        proxy_pass http://shipyard_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }

    # probes for Docker / Kubernetes
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # basic nginx counters (only reachable from inside the network)
    location = /nginx_status {
        stub_status;
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
    }
}
