global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files: [/etc/prometheus/alerts.yml]

scrape_configs:
  - job_name: shipyard-app
    # Docker's DNS returns every replica of "app", so scaled copies are all scraped.
    dns_sd_configs:
      - names: [app]
        type: A
        port: 8000
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
