- name: Copy Kubernetes manifests to the server
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../k8s/"
    dest: "{{ app_dir }}/k8s/"
    mode: "0644"

- name: Point manifests at your container registry
  ansible.builtin.replace:
    path: "{{ app_dir }}/k8s/{{ item }}"
    regexp: 'ghcr\.io/OWNER/shipyard'
    replace: "{{ image_repo }}"
  loop: [kustomization.yaml, app.yaml, web.yaml]

- name: Set the image tag to deploy
  ansible.builtin.replace:
    path: "{{ app_dir }}/k8s/kustomization.yaml"
    regexp: 'newTag: .*'
    replace: 'newTag: "{{ image_tag }}"'

- name: Apply manifests (kubectl apply -k)
  ansible.builtin.command: k3s kubectl apply -k {{ app_dir }}/k8s
  register: apply
  changed_when: "'created' in apply.stdout or 'configured' in apply.stdout"

- name: Restart pods when deploying a moving tag like latest
  ansible.builtin.command: k3s kubectl -n shipyard rollout restart deploy/app deploy/web
  when: image_tag == "latest"
  changed_when: true

- name: Wait for rollouts to finish
  ansible.builtin.command: k3s kubectl -n shipyard rollout status deploy/{{ item }} --timeout=180s
  loop: [redis, app, web]
  changed_when: false

- name: Show where to find everything
  ansible.builtin.debug:
    msg:
      - "App:     http://{{ ansible_host }}"
      - "Grafana: http://grafana.{{ ansible_host }}.nip.io  (user admin)"
      - "kubectl: export KUBECONFIG=$PWD/kubeconfig  (from the repo root)"
